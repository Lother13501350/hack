name: CI
# Manual only for now: GitHub is not starting Actions jobs for this account
# (billing), so automatic runs just mark every PR as failed.
# To restore, replace the trigger with: pull_request + push to main.
# Until then, run `pnpm check` and `pnpm build` locally before merging.
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
